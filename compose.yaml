name: sre-observability-lab

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile

    image: sre-observability-api:local

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LAB_FAULTS_ENABLED: "false"
      LOG_FILE_PATH: /var/log/sre-api/api.log
      OTEL_TRACES_ENABLED: "true"
      OTEL_SERVICE_NAME: sre-observability-lab-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://alloy:4318/v1/traces"
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

    ports:
      - "127.0.0.1:3000:3000"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    volumes:
      - api_logs:/var/log/sre-api

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    init: true

    networks:
      - observability

    restart: "no"

  prometheus:
    image: prom/prometheus@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=0.0.0.0:9090

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - ./observability/prometheus/alerting-recording-rules.yml:/etc/prometheus/alerting-recording-rules.yml:ro
      - ./observability/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 0.50
    pids_limit: 150

    init: true

    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started

    networks:
      - observability

    restart: "no"



  alertmanager:
    image: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=

    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    ports:
      - "127.0.0.1:9093:9093"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100

    init: true

    networks:
      - observability

    restart: "no"

  loki:
    image: grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193

    command:
      - -config.file=/etc/loki/config.yaml

    user: "10001:10001"

    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

    ports:
      - "127.0.0.1:3100:3100"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 150

    init: true

    networks:
      - observability

    restart: "no"

  tempo:
    image: grafana/tempo@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5

    command:
      - --config.file=/etc/tempo/config.yaml

    user: "10001:10001"

    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

    ports:
      - "127.0.0.1:3200:3200"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 0.50
    pids_limit: 150

    init: true

    networks:
      - observability

    restart: "no"

  alloy:
    image: grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy

    user: "473:473"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api_logs:/var/log/sre-api:ro
      - alloy_data:/var/lib/alloy/data

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 150

    init: true

    depends_on:
      api:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

    networks:
      - observability

    restart: "no"

  grafana:
    image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572

    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_LOG_MODE: console
      GF_PATHS_LOGS: /tmp/grafana-logs

      # Keep the digest-pinned Grafana image deterministic.
      # Grafana 13.2 externalizes several built-in datasources,
      # including Prometheus, and otherwise auto-updates them.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

    ports:
      - "127.0.0.1:3001:3000"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 384m
    cpus: 0.50
    pids_limit: 150

    init: true

    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    networks:
      - observability

    restart: "no"

volumes:
  api_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

networks:
  observability:
    driver: bridge
