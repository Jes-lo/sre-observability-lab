name: sre-observability-lab

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile

    image: sre-observability-api:local

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LAB_FAULTS_ENABLED: "false"

    ports:
      - "127.0.0.1:3000:3000"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    init: true

    networks:
      - observability

    restart: "no"

  prometheus:
    image: prom/prometheus@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=0.0.0.0:9090

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 0.50
    pids_limit: 150

    init: true

    depends_on:
      api:
        condition: service_healthy

    networks:
      - observability

    restart: "no"


  grafana:
    image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572

    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_LOG_MODE: console
      GF_PATHS_LOGS: /tmp/grafana-logs

      # Keep the digest-pinned Grafana image deterministic.
      # Grafana 13.2 externalizes several built-in datasources,
      # including Prometheus, and otherwise auto-updates them.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

    ports:
      - "127.0.0.1:3001:3000"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 384m
    cpus: 0.50
    pids_limit: 150

    init: true

    depends_on:
      - prometheus

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    networks:
      - observability

    restart: "no"

volumes:
  prometheus_data:
  grafana_data:

networks:
  observability:
    driver: bridge
