name: CI Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-validation:
    name: Application Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run application tests
        working-directory: app
        run: npm test

      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev

  container-validation:
    name: Container Security Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate hardened API container
        env:
          KEEP_IMAGE: "true"
        run: ./scripts/validate-api-container.sh

      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sre-observability-api:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          hide-progress: true
          version: v0.74.0

      - name: Enforce fixable HIGH/CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sre-observability-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          hide-progress: true
          version: v0.74.0
          skip-setup-trivy: true

      - name: Clean up validated API image
        if: always()
        run: docker image rm -f sre-observability-api:ci >/dev/null 2>&1 || true

  prometheus-validation:
    name: Prometheus Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Prometheus configuration
        run: ./scripts/validate-prometheus.sh

  grafana-validation:
    name: Grafana Dashboard Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Grafana dashboards
        run: ./scripts/validate-grafana.sh

  logging-validation:
    name: Logging Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate centralized logging configuration
        run: ./scripts/validate-logging.sh

  tracing-validation:
    name: Tracing Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate distributed tracing configuration
        run: ./scripts/validate-tracing.sh

  slo-validation:
    name: SLO Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SLO and error-budget configuration
        run: ./scripts/validate-slo.sh

  alerting-validation:
    name: Alerting Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Alertmanager and burn-rate alerting
        run: ./scripts/validate-alerting.sh

  load-validation:
    name: Load Scenario Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate controlled-load configuration
        run: ./scripts/validate-load.sh

      - name: Run isolated controlled-load scenarios
        run: ./scripts/validate-load-runtime.sh

  incident-response-validation:
    name: Incident Response Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate incident-response documentation
        run: ./scripts/validate-incident-response.sh

      - name: Run availability incident exercise
        run: ./scripts/run-incident-exercise.sh availability

      - name: Run latency incident exercise
        run: ./scripts/run-incident-exercise.sh latency
