groups:
  - name: sre_api_symptom_alerts
    interval: 5s

    rules:
      - alert: SreApiHigh5xxRatio
        expr: >-
          sre_api:slo_availability_bad_ratio:rate1m
          >
          0.05
        for: 30s
        labels:
          severity: warning
          service: sre-api
          environment: local
          category: symptom
          slo: availability
        annotations:
          summary: Eligible API requests are returning elevated HTTP 5xx responses.
          description: More than 5% of eligible requests returned HTTP 5xx over the one-minute symptom window.

      - alert: SreApiHighLatencyRatio
        expr: >-
          sre_api:slo_latency_bad_ratio:rate1m
          >
          0.05
        for: 30s
        labels:
          severity: warning
          service: sre-api
          environment: local
          category: symptom
          slo: latency
        annotations:
          summary: Eligible API requests are experiencing elevated latency.
          description: More than 5% of eligible non-5xx requests exceeded 250 ms over the one-minute symptom window.

  - name: sre_api_burn_rate_alerts
    interval: 5s

    rules:
      - alert: SreApiAvailabilityBurnRateFast
        expr: >-
          (
            sre_api:slo_availability_burn_rate:ratio1m
            >
            10
          )
          and on()
          (
            sre_api:slo_availability_burn_rate:ratio5m
            >
            10
          )
        for: 30s
        labels:
          severity: critical
          service: sre-api
          environment: local
          category: burn-rate
          slo: availability
        annotations:
          summary: Availability error budget is burning at a critical rate.
          description: Availability burn rate is above 10x on both the one-minute and five-minute windows.

      - alert: SreApiAvailabilityBurnRateSlow
        expr: >-
          (
            sre_api:slo_availability_burn_rate:ratio5m
            >
            2
          )
          and on()
          (
            sre_api:slo_availability_burn_rate:ratio15m
            >
            2
          )
        for: 1m
        labels:
          severity: warning
          service: sre-api
          environment: local
          category: burn-rate
          slo: availability
        annotations:
          summary: Availability error budget is burning at a sustained rate.
          description: Availability burn rate is above 2x on both the five-minute and fifteen-minute windows.

      - alert: SreApiLatencyBurnRateFast
        expr: >-
          (
            sre_api:slo_latency_burn_rate:ratio1m
            >
            10
          )
          and on()
          (
            sre_api:slo_latency_burn_rate:ratio5m
            >
            10
          )
        for: 30s
        labels:
          severity: critical
          service: sre-api
          environment: local
          category: burn-rate
          slo: latency
        annotations:
          summary: Latency error budget is burning at a critical rate.
          description: Latency burn rate is above 10x on both the one-minute and five-minute windows.

      - alert: SreApiLatencyBurnRateSlow
        expr: >-
          (
            sre_api:slo_latency_burn_rate:ratio5m
            >
            2
          )
          and on()
          (
            sre_api:slo_latency_burn_rate:ratio15m
            >
            2
          )
        for: 1m
        labels:
          severity: warning
          service: sre-api
          environment: local
          category: burn-rate
          slo: latency
        annotations:
          summary: Latency error budget is burning at a sustained rate.
          description: Latency burn rate is above 2x on both the five-minute and fifteen-minute windows.
