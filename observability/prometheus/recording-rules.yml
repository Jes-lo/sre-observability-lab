groups:
  - name: sre_api_red
    interval: 5s

    rules:
      - record: sre_api:http_requests:rate1m
        expr: >-
          sum(
            rate(
              sre_lab_http_requests_total{
                job="sre-observability-api"
              }[1m]
            )
          )

      - record: sre_api:http_5xx:rate1m
        expr: >-
          sum(
            rate(
              sre_lab_http_requests_total{
                job="sre-observability-api",
                status_code=~"5.."
              }[1m]
            )
          )
          or vector(0)

      - record: sre_api:http_error_ratio:rate1m
        expr: >-
          (
            sum(
              rate(
                sre_lab_http_requests_total{
                  job="sre-observability-api",
                  status_code=~"5.."
                }[1m]
              )
            )
            or vector(0)
          )
          /
          clamp_min(
            sum(
              rate(
                sre_lab_http_requests_total{
                  job="sre-observability-api"
                }[1m]
              )
            ),
            0.000001
          )

      - record: sre_api:http_request_duration_seconds:p95_1m
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(
                sre_lab_http_request_duration_seconds_bucket{
                  job="sre-observability-api"
                }[1m]
              )
            )
          )
