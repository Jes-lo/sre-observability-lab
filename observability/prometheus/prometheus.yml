global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: sre-observability-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          environment: local
